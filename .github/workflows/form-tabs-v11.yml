name: Form Tabs V11
on:
  push:
    branches:
      - fix/form-tabs-rail-baseline-v11
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V11 form tabs
        run: python3 .github/scripts/apply_form_tabs_v11.py
      - name: Validate JS
        run: node --check saas_theme/public/js/interaction_finish_v2.js
      - name: Validate architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert exact rail contract
        run: |
          grep -F 'AUTHORITATIVE FINAL FORM TABS V11' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'margin: 0 !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'padding: 0 !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'border: 0 !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'form-tabs::after' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'border-bottom: 0 !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'padding: 8px 14px 9px !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'border-radius: 13px 13px 0 0 !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F '/assets/saas_theme/css/ui_consolidation_v7.css?v=11' saas_theme/hooks.py
          grep -F '/assets/saas_theme/js/interaction_finish_v2.js?v=6' saas_theme/hooks.py
      - name: Commit production fix
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/hooks.py saas_theme/public/css/ui_consolidation_v7.css saas_theme/public/js/interaction_finish_v2.js scripts/validate_theme_architecture.py
          git commit -m 'fix: remove outer tab rail effects and open active tab baseline' || exit 0
          git push origin HEAD:fix/form-tabs-rail-baseline-v11
