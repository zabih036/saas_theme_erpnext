name: Theme Architecture Check

on:
  push:
    branches:
      - refactor/theme-maintenance-architecture
  pull_request:
    paths:
      - 'saas_theme/hooks.py'
      - 'saas_theme/public/css/**'
      - 'saas_theme/public/js/**'
      - 'THEME_MAINTENANCE.md'
      - 'scripts/validate_theme_architecture.py'
      - 'scripts/validate_theme_late_loaders.py'
      - 'scripts/test_stability_runtime.js'
      - 'scripts/test_report_filter_geometry.js'
      - 'scripts/test_home_dashboard.py'
      - 'scripts/test_home_dashboard_ui.js'
      - 'scripts/test_home_visuals_and_picker.js'
      - 'scripts/test_home_v10_layout.js'
      - 'saas_theme/home.py'
      - 'scripts/validate_phase3c_css_bundle.py'
      - 'scripts/validate_phase3d_popup_bundle.py'
      - 'scripts/validate_phase3e_overlay_bundle.py'
      - 'scripts/audit_runtime_asset_references.py'
      - 'scripts/validate_phase4_canonical_names.py'
      - 'scripts/validate_phase4b_stability_asset.py'
      - '.github/workflows/theme-architecture-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Validate late-loaded asset dependencies
        run: python3 scripts/validate_theme_late_loaders.py
      - name: Validate stability controller syntax and behavior
        run: |
          node --check saas_theme/public/js/stability_refinement_v3.js
          node scripts/test_stability_runtime.js
      - name: Validate Phase 3C stylesheet byte parity
        run: python3 scripts/validate_phase3c_css_bundle.py
      - name: Validate Phase 3D popup CSS cascade parity
        run: python3 scripts/validate_phase3d_popup_bundle.py
      - name: Validate Phase 3E overlay CSS cascade parity
        run: python3 scripts/validate_phase3e_overlay_bundle.py
      - name: Audit Phase 3F live CSS and JS references
        run: python3 scripts/audit_runtime_asset_references.py
      - name: Validate Phase 4 canonical CSS rename integrity
        run: python3 scripts/validate_phase4_canonical_names.py
      - name: Validate Phase 4B stability CSS and loader parity
        run: python3 scripts/validate_phase4b_stability_asset.py
      - name: Validate report filter geometry and controller syntax
        run: |
          node --check saas_theme/public/js/ui_precision_v6_2.js
          node scripts/test_report_filter_geometry.js
      - name: Validate Home permission and finance analytics
        run: |
          python3 -m py_compile saas_theme/home.py
          python3 scripts/test_home_dashboard.py
          node --check saas_theme/public/js/home_dashboard.js
          node --check saas_theme/public/js/home_analytics.js
          node scripts/test_home_dashboard_ui.js
          node --check saas_theme/public/js/quick_access_preferences.js
          node scripts/test_home_visuals_and_picker.js
          node scripts/test_home_v10_layout.js
