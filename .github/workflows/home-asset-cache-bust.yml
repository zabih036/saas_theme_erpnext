name: Home Asset Cache Bust
on:
  push:
    branches:
      - fix/home-asset-cache-bust
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cache-bust update
        run: python3 .github/scripts/bump_home_asset_cache.py
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert exact Home asset versions
        run: |
          grep -F '/assets/saas_theme/css/home.css?v=7' saas_theme/hooks.py
          grep -F '/assets/saas_theme/js/home_analytics.js?v=7' saas_theme/hooks.py
          ! grep -F '/assets/saas_theme/css/home.css?v=1' saas_theme/hooks.py
          ! grep -F '/assets/saas_theme/js/home_analytics.js?v=1' saas_theme/hooks.py
      - name: Commit cache-bust update
        run: |
          if git diff --quiet -- saas_theme/hooks.py scripts/validate_theme_architecture.py; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/hooks.py scripts/validate_theme_architecture.py
          git commit -m 'fix: bust Home asset cache after dashboard updates'
          git push origin HEAD:fix/home-asset-cache-bust
