name: Form Tabs Joined Card Validation
on:
  push:
    branches:
      - fix/form-tabs-joined-card
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply joined tab/card design
        run: python3 .github/scripts/apply_joined_form_tabs.py
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert integrated tab card design
        run: |
          grep -F 'Integrated form tabs: one continuous card with the form body below.' saas_theme/public/css/form_surface.css
          grep -F 'border-radius: 16px 16px 0 0' saas_theme/public/css/form_surface.css
          grep -F 'border-top: 0 !important' saas_theme/public/css/form_surface.css
          grep -F 'margin-top: -1px !important' saas_theme/public/css/form_surface.css
          grep -F '/assets/saas_theme/css/form_surface.css?v=3' saas_theme/hooks.py
          ! grep -F '/assets/saas_theme/css/form_surface.css?v=2' saas_theme/hooks.py
      - name: Assert runtime scope
        run: |
          git diff --name-only HEAD -- saas_theme/public saas_theme/hooks.py scripts/validate_theme_architecture.py | tee /tmp/files
          test "$(cat /tmp/files)" = $'saas_theme/hooks.py\nsaas_theme/public/css/form_surface.css\nscripts/validate_theme_architecture.py'
      - name: Commit joined form-tab card design
        run: |
          if git diff --quiet -- saas_theme/public/css/form_surface.css saas_theme/hooks.py scripts/validate_theme_architecture.py; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/public/css/form_surface.css saas_theme/hooks.py scripts/validate_theme_architecture.py
          git commit -m 'fix: join form tabs with form card surface'
          git push origin HEAD:fix/form-tabs-joined-card
