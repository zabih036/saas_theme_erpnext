name: Form Comments True Alignment
on:
  push:
    branches:
      - fix/form-comments-true-alignment
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply real form/footer alignment
        run: python3 .github/scripts/apply_form_comments_alignment.py
      - name: Validate JavaScript syntax
        run: node --check saas_theme/public/js/interaction_finish_v2.js
      - name: Validate architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert visible layout contract
        run: |
          grep -F 'FORM CARD / COMMENTS SPACING V2' saas_theme/public/css/form_surface.css
          grep -F '.layout-main-section-wrapper > div:has(> .form-footer)' saas_theme/public/css/form_surface.css
          grep -F 'margin: 12px 0 0 !important' saas_theme/public/css/form_surface.css
          grep -F 'padding: 0 10px 12px !important' saas_theme/public/css/form_surface.css
          grep -F 'AUTHORITATIVE FINAL FORM TABS V13' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'margin: 0 !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F '/assets/saas_theme/css/form_surface.css?v=7' saas_theme/hooks.py
          grep -F '/assets/saas_theme/css/ui_consolidation_v7.css?v=13' saas_theme/hooks.py
          grep -F '/assets/saas_theme/js/interaction_finish_v2.js?v=8' saas_theme/hooks.py
      - name: Commit production fix
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/hooks.py saas_theme/public/css/form_surface.css saas_theme/public/css/ui_consolidation_v7.css saas_theme/public/js/interaction_finish_v2.js scripts/validate_theme_architecture.py
          git commit -m 'fix: align form card and comments with real Frappe footer DOM' || exit 0
          git push origin HEAD:fix/form-comments-true-alignment
