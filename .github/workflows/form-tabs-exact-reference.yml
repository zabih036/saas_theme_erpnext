name: Form Tabs Exact Reference Validation
on:
  push:
    branches:
      - fix/form-tabs-exact-reference
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove historical tab overrides and apply final reference design
        run: python3 .github/scripts/remove_legacy_form_tab_overrides.py
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert exact tab owner
        run: |
          grep -F 'Authoritative visual owner for Frappe form tabs.' saas_theme/public/css/form_surface.css
          grep -F 'border-bottom: 2px solid #064ADB' saas_theme/public/css/form_surface.css
          grep -F 'border-color: #064ADB #064ADB #FFFFFF' saas_theme/public/css/form_surface.css
          grep -F 'margin: -1px 12px 14px' saas_theme/public/css/form_surface.css
          ! grep -F 'FORM TABS — QUIETER RAIL, CLEAR ACTIVE STATE' saas_theme/public/css/form_surface.css
          ! grep -F 'The tab rail is one small surface; the active tab remains the only strong blue.' saas_theme/public/css/form_surface.css
          grep -F '/assets/saas_theme/css/form_surface.css?v=4' saas_theme/hooks.py
      - name: Assert runtime scope
        run: |
          git diff --name-only HEAD -- saas_theme/public saas_theme/hooks.py scripts/validate_theme_architecture.py | tee /tmp/files
          test "$(cat /tmp/files)" = $'saas_theme/hooks.py\nsaas_theme/public/css/form_surface.css\nscripts/validate_theme_architecture.py'
      - name: Commit production fix
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/public/css/form_surface.css saas_theme/hooks.py scripts/validate_theme_architecture.py
          git commit -m 'fix: remove legacy form-tab overrides and match reference'
          git push origin HEAD:fix/form-tabs-exact-reference
