name: Home Dashboard Redesign Validation

on:
  push:
    branches:
      - feature/home-dashboard-analytics-redesign

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Home redesign patch
        run: python3 .github/scripts/redesign_home_dashboard.py
      - name: Validate Python
        run: python3 -m py_compile saas_theme/home.py
      - name: Validate JavaScript
        run: node --check saas_theme/public/js/home_analytics.js
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert Home-only runtime scope
        run: |
          changed="$(git diff --name-only HEAD -- saas_theme/public/css saas_theme/public/js)"
          echo "$changed"
          test "$changed" = $'saas_theme/public/css/home.css\nsaas_theme/public/js/home_analytics.js'
      - name: Commit redesign output
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/home.py saas_theme/public/css/home.css saas_theme/public/js/home_analytics.js
          if git diff --cached --quiet; then
            echo 'No redesign changes to commit.'
            exit 0
          fi
          git commit -m 'feat: redesign Home dashboard analytics and activity'
          git push origin HEAD:feature/home-dashboard-analytics-redesign
