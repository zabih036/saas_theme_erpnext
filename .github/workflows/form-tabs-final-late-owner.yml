name: Form Tabs Final Late Owner Validation
on:
  push:
    branches:
      - fix/form-tabs-final-late-owner
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final late form-tab ownership
        run: python3 .github/scripts/apply_final_late_form_tabs.py
      - name: Validate JavaScript syntax
        run: node --check saas_theme/public/js/interaction_finish_v2.js
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert old active tab owners are gone
        run: |
          ! grep -F '.form-tabs-list .nav-link.active' saas_theme/public/css/form.css
          ! grep -F '.form-tabs-list .nav-link.active' saas_theme/public/css/form_surface.css
          grep -F 'AUTHORITATIVE FINAL FORM TABS V8' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'background: #FFFFFF !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'color: #064ADB !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'border-bottom-color: #FFFFFF !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F '/assets/saas_theme/css/ui_consolidation_v7.css?v=8' saas_theme/public/js/interaction_finish_v2.js
          grep -F '/assets/saas_theme/css/form.css?v=3' saas_theme/hooks.py
          grep -F '/assets/saas_theme/css/form_surface.css?v=5' saas_theme/hooks.py
          grep -F '/assets/saas_theme/js/interaction_finish_v2.js?v=3' saas_theme/hooks.py
      - name: Assert runtime scope
        run: |
          git diff --name-only HEAD -- saas_theme/public saas_theme/hooks.py scripts/validate_theme_architecture.py | tee /tmp/files
          test "$(cat /tmp/files)" = $'saas_theme/hooks.py\nsaas_theme/public/css/form.css\nsaas_theme/public/css/form_surface.css\nsaas_theme/public/css/ui_consolidation_v7.css\nsaas_theme/public/js/interaction_finish_v2.js\nscripts/validate_theme_architecture.py'
      - name: Commit production fix
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/hooks.py saas_theme/public/css/form.css saas_theme/public/css/form_surface.css saas_theme/public/css/ui_consolidation_v7.css saas_theme/public/js/interaction_finish_v2.js scripts/validate_theme_architecture.py
          git commit -m 'fix: make late v7 layer authoritative for form tabs'
          git push origin HEAD:fix/form-tabs-final-late-owner
