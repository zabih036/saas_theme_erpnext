name: Home Sidebar V7 Validation
on:
  push:
    branches:
      - fix/home-sidebar-position-and-toggle
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Home sidebar revision
        run: python3 .github/scripts/fix_home_sidebar_v7.py
      - name: Validate JavaScript
        run: node --check saas_theme/public/js/home_analytics.js
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert Home-only runtime scope
        run: |
          git diff --name-only HEAD -- saas_theme/public | tee /tmp/runtime-files
          test "$(cat /tmp/runtime-files)" = $'saas_theme/public/css/home.css\nsaas_theme/public/js/home_analytics.js'
      - name: Assert requested behavior
        run: |
          grep -F 'saas_theme_home_quick_sidebar_hidden_v2' saas_theme/public/js/home_analytics.js
          grep -F 'st-home-sidebar-toggle' saas_theme/public/js/home_analytics.js
          grep -F '$dashboard.detach().prependTo($main)' saas_theme/public/js/home_analytics.js
          grep -F 'Active Suppliers' saas_theme/public/js/home_analytics.js
          grep -F 'report_route("Profit and Loss Statement")' saas_theme/public/js/home_analytics.js
          ! grep -F "const logo = event.target?.closest?.('.navbar-brand .app-logo')" saas_theme/public/js/home_analytics.js
      - name: Commit Home sidebar revision
        run: |
          if git diff --quiet -- saas_theme/public/css/home.css saas_theme/public/js/home_analytics.js; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/public/css/home.css saas_theme/public/js/home_analytics.js
          git commit -m 'fix: position Home Quick Access sidebar and add dedicated toggle'
          git push origin HEAD:fix/home-sidebar-position-and-toggle
