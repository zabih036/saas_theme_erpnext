name: Theme Cleanup Phase 2 Finalize

on:
  push:
    branches:
      - refactor/theme-cleanup-phase-2-finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize safe cleanup architecture
        run: python3 .github/scripts/finalize_phase2_cleanup.py
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert no runtime CSS/JS changes
        run: |
          git diff --exit-code origin/version-16...HEAD -- saas_theme/public/css saas_theme/public/js || true
          if git diff --name-only origin/version-16...HEAD -- saas_theme/public/css saas_theme/public/js | grep -q .; then
            echo 'Runtime CSS/JS changed during phase-2 finalization.'
            exit 1
          fi
      - name: Commit finalization output
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add THEME_MAINTENANCE.md scripts/validate_theme_architecture.py
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: finalize safe theme cleanup architecture'
          git push origin HEAD:refactor/theme-cleanup-phase-2-finalize
