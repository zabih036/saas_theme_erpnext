name: Theme Cleanup Phase 2 Precision CSS

on:
  push:
    branches:
      - refactor/theme-cleanup-phase-2-precision-css

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact precision CSS bundle
        run: python3 .github/scripts/migrate_precision_css.py
      - name: Validate theme architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Commit migration output
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: bundle precision CSS without behavior changes'
          git push origin HEAD:refactor/theme-cleanup-phase-2-precision-css
