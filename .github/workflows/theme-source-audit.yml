name: Consolidate Complete Theme

on:
  push:
    branches:
      - fix/theme-cleanup

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build permanent theme files from merged working state
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=041900291b68052807bb1b6c98d116b58a9f50e0
          ROOT=saas_theme/public
          TMP=/tmp/saas-theme-source

          rm -rf "$TMP"
          mkdir -p "$TMP"
          git archive "$SOURCE" saas_theme/public saas_theme/hooks.py saas_theme/www/login.html | tar -x -C "$TMP"

          css_files=(
            professional_ui.css
            form_controls.css
            form_navigation.css
            list_view.css
            home_dashboard.css
            home_analytics.css
            brand_shell.css
            form_palette.css
            palette_refinement.css
            ui_finish.css
            interface_refinement.css
            mobile_shell.css
            workspace_shell_polish.css
            dark_mode_refinement.css
            dark_surface_fix.css
            desktop_navbar_refinement.css
            tree_view_refinement.css
            home_clarity_refinement.css
            control_precision_fix.css
            exact_ui_followup.css
            final_precision_v2.css
            form_experience_refinement.css
            professional_form_card_fix.css
            grid_and_action_alignment.css
            report_and_form_shell.css
            child_row_editor_finish.css
            overlay_stacking_fix.css
            overlay_stacking_v3.css
            interaction_finish_v2.css
            global_popup_polish_v3.css
            compact_autocomplete_and_form_gap_v4.css
            stability_refinement_v3.css
            ui_precision_v4.css
            child_table_precision_v5.css
            inline_grid_link_popup_anchor_v5.css
            ui_precision_v6.css
            ui_precision_v6_2.css
            ui_consolidation_v7.css
          )

          js_files=(
            professional_ui.js
            home_dashboard.js
            home_analytics.js
            brand_shell.js
            ui_finish.js
            route_loader.js
            mobile_shell.js
            workspace_shell_polish.js
            final_shell_cleanup.js
            user_theme_menu.js
            form_sidebar_persistence.js
            quick_access_preferences.js
            child_row_editor_finish.js
            stability_refinement_v3.js
            ui_precision_v4.js
            child_table_precision_v5.js
            inline_grid_link_popup_anchor_v5.js
            ui_precision_v6.js
            ui_precision_v6_2.js
            interaction_finish_v2.js
          )

          {
            echo '/*'
            echo ' * SaaS Theme — Complete Project Customizations'
            echo ' * Mechanically consolidated from merged working commit 041900291b68052807bb1b6c98d116b58a9f50e0.'
            echo ' * Historical cascade order is preserved. Future Desk CSS changes belong in this file.'
            echo ' */'
            for f in "${css_files[@]}"; do
              echo
              echo "/* ===== BEGIN HISTORICAL LAYER: $f ===== */"
              cat "$TMP/saas_theme/public/css/$f"
              echo
              echo "/* ===== END HISTORICAL LAYER: $f ===== */"
            done
          } > "$ROOT/css/custom.css"

          # Work from exact historical JS files, then make only consolidation-safe
          # loader changes and the focused inline-grid Link popup correction.
          cp -a "$TMP/saas_theme/public/js" /tmp/theme-js

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/theme-js')

          # CSS is now bundled in custom.css, so old runtime CSS injectors are no-ops.
          p = root / 'ui_precision_v6_2.js'
          s = p.read_text()
          s = re.sub(
              r'\n\tfunction load_css\(\) \{.*?\n\t\}\n',
              '\n\tfunction load_css() { /* bundled in custom.css */ }\n',
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s)

          p = root / 'interaction_finish_v2.js'
          s = p.read_text()
          s = re.sub(
              r'\n\tfunction ensureStyleLast\(\) \{.*?\n\t\}\n',
              '\n\tfunction ensureStyleLast() { /* ui_consolidation_v7.css is bundled last in custom.css */ }\n',
              s,
              count=1,
              flags=re.S,
          )
          s = re.sub(
              r'\n\tfunction setupStyleOrderGuard\(\) \{.*?\n\t\}\n',
              '\n\tfunction setupStyleOrderGuard() { /* no runtime stylesheet injection after consolidation */ }\n',
              s,
              count=1,
              flags=re.S,
          )

          old = '''\tfunction isInlineGridInput(input) {
\t\treturn Boolean(input instanceof HTMLInputElement && input.closest(".form-grid .editable-row") && input.closest(".grid-static-col, .grid-field"));
\t}'''
          new = '''\tfunction inlineGridFieldType(input) {
\t\treturn String(
\t\t\tinput?.dataset?.fieldtype ||
\t\t\tinput?.getAttribute?.("data-fieldtype") ||
\t\t\tinput?.closest?.("[data-fieldtype]")?.getAttribute?.("data-fieldtype") ||
\t\t\t""
\t\t);
\t}

\tfunction isInlineGridInput(input) {
\t\tif (!(input instanceof HTMLInputElement)) return false;
\t\tif (!input.closest(".form-grid .editable-row")) return false;
\t\tif (!input.closest(".grid-static-col, .grid-field")) return false;
\t\treturn ["Link", "Dynamic Link", "Autocomplete"].includes(inlineGridFieldType(input));
\t}'''
          if old not in s:
              raise SystemExit('Expected isInlineGridInput block not found')
          s = s.replace(old, new, 1)

          old = '''\tfunction findGridPopup(input) {
\t\tif (!isInlineGridInput(input)) return null;
\t\tconst controlsId = input.getAttribute("aria-controls");'''
          new = '''\tfunction findGridPopup(input) {
\t\tif (!isInlineGridInput(input)) return null;
\t\tif (input.awesomplete?.ul instanceof Element) return input.awesomplete.ul;
\t\tconst controlsId = input.getAttribute("aria-controls");'''
          if old not in s:
              raise SystemExit('Expected findGridPopup block not found')
          s = s.replace(old, new, 1)

          marker = '''\tfunction positionGridPopup(list, meta) {
\t\tconst input = meta?.input;
\t\tif (!input?.isConnected || !listIsOpen(list)) return;
\t\tconst rect = input.getBoundingClientRect();'''
          replacement = '''\tfunction gridPopupAnchorRect(input) {
\t\tconst candidates = [
\t\t\tinput.closest(".control-input-wrapper"),
\t\t\tinput.closest(".frappe-control"),
\t\t\tinput.closest(".grid-field"),
\t\t\tinput.closest(".grid-static-col"),
\t\t\tinput,
\t\t].filter(Boolean);
\t\tfor (const element of candidates) {
\t\t\tconst rect = element.getBoundingClientRect();
\t\t\tif (rect.width >= 160 && rect.height > 0 && rect.height < 140) return rect;
\t\t}
\t\treturn input.getBoundingClientRect();
\t}

\tfunction positionGridPopup(list, meta) {
\t\tconst input = meta?.input;
\t\tif (!input?.isConnected || !listIsOpen(list)) return;
\t\tconst rect = gridPopupAnchorRect(input);'''
          if marker not in s:
              raise SystemExit('Expected positionGridPopup marker not found')
          s = s.replace(marker, replacement, 1)
          s = s.replace(
              'const width = Math.max(1, Math.round(rect.width));',
              'const width = Math.max(180, Math.round(rect.width));',
              1,
          )

          old = '''\t\tif (popupPortals.has(list)) {
\t\t\tpositionGridPopup(list, popupPortals.get(list));
\t\t\treturn;
\t\t}'''
          new = '''\t\tif (popupPortals.has(list)) {
\t\t\tconst meta = popupPortals.get(list);
\t\t\tmeta.input = input;
\t\t\tpositionGridPopup(list, meta);
\t\t\treturn;
\t\t}'''
          if old not in s:
              raise SystemExit('Expected existing popup portal block not found')
          s = s.replace(old, new, 1)

          old = '''\tfunction scanGridPopups() {
\t\tdocument.querySelectorAll(".form-grid .editable-row input").forEach((input) => {
\t\t\tif (!isInlineGridInput(input)) return;
\t\t\tconst list = findGridPopup(input);
\t\t\tif (list && listIsOpen(list)) portalGridPopup(input, list);
\t\t});
\t\tfor (const [list, meta] of Array.from(popupPortals.entries())) {
\t\t\tif (!meta.input?.isConnected || !list.isConnected || !listIsOpen(list)) restoreGridPopup(list);
\t\t}
\t}'''
          new = '''\tfunction scanGridPopups() {
\t\tconst input = document.activeElement;
\t\tif (isInlineGridInput(input)) {
\t\t\tconst list = findGridPopup(input);
\t\t\tif (list && listIsOpen(list)) portalGridPopup(input, list);
\t\t}
\t\tfor (const [list, meta] of Array.from(popupPortals.entries())) {
\t\t\tif (!meta.input?.isConnected || !list.isConnected || !listIsOpen(list)) restoreGridPopup(list);
\t\t}
\t}'''
          if old not in s:
              raise SystemExit('Expected scanGridPopups block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          {
            echo '/*'
            echo ' * SaaS Theme — Complete Project Interactions'
            echo ' * Mechanically consolidated from merged working commit 041900291b68052807bb1b6c98d116b58a9f50e0.'
            echo ' * Historical execution order is preserved. Future Desk JS changes belong in this file.'
            echo ' */'
            for f in "${js_files[@]}"; do
              echo
              echo "/* ===== BEGIN HISTORICAL CONTROLLER: $f ===== */"
              cat "/tmp/theme-js/$f"
              echo
              echo "/* ===== END HISTORICAL CONTROLLER: $f ===== */"
            done
          } > "$ROOT/js/custom.js"

          # Login: preserve the original login design + refinement + transition/branding behavior.
          {
            echo '/* SaaS Theme — Complete Login Styling */'
            cat "$TMP/saas_theme/public/css/login.css"
            echo
            echo '/* ===== login_refinement.css ===== */'
            cat "$TMP/saas_theme/public/css/login_refinement.css"
          } > "$ROOT/css/login.css"

          {
            echo '/* SaaS Theme — Complete Login Interactions */'
            cat "$TMP/saas_theme/public/js/route_loader.js"
            echo
            echo '/* ===== login_fix.js ===== */'
            cat "$TMP/saas_theme/public/js/login_fix.js"
          } > "$ROOT/js/login.js"

          # Keep only the permanent public asset structure.
          find "$ROOT/css" -maxdepth 1 -type f ! -name 'saas_theme.css' ! -name 'custom.css' ! -name 'login.css' -delete
          find "$ROOT/js" -maxdepth 1 -type f ! -name 'saas_theme.js' ! -name 'custom.js' ! -name 'login.js' -delete

          cat > saas_theme/hooks.py <<'PYHOOKS'
          app_name = "saas_theme"
          app_title = "Saas Theme by CommitStreet"
          app_publisher = "CommitStreet"
          app_description = "A modern, polished SaaS UI theme for Frappe Framework — featuring a dual sidebar with workspace rail, redesigned form inputs, slide-in child table editor, enhanced attachments, and a refined dashboard experience."
          app_email = "vineyrawat@yahoo.com"
          app_license = "MIT"
          frappe_version = ">=16.0.0 <17.0.0"
          categories = ["Customization", "UI/UX"]

          # Permanent Desk structure. Do not add versioned/final/follow-up assets.
          app_include_css = [
              "/assets/saas_theme/css/saas_theme.css",
              "/assets/saas_theme/css/custom.css",
          ]

          app_include_js = [
              "/assets/saas_theme/js/saas_theme.js",
              "/assets/saas_theme/js/custom.js",
          ]

          # login.css is linked directly by the custom login template.
          web_include_js = [
              "/assets/saas_theme/js/login.js",
          ]
          PYHOOKS

          # Remove cache-busting suffix from the single permanent login stylesheet reference.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('saas_theme/www/login.html')
          s = p.read_text()
          s = s.replace('/assets/saas_theme/css/login.css?v=6', '/assets/saas_theme/css/login.css')
          p.write_text(s)
          PY

          echo '=== Remaining historical asset URL references inside custom.js ==='
          grep -n '/assets/saas_theme/' "$ROOT/js/custom.js" || true

          echo '=== Final public asset tree ==='
          find "$ROOT/css" "$ROOT/js" -maxdepth 1 -type f -print | sort

          echo '=== Validate JavaScript syntax ==='
          node --check "$ROOT/js/custom.js"
          node --check "$ROOT/js/login.js"

      - name: Commit consolidated theme
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No consolidation changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore all theme work in permanent files'
          git push origin HEAD:fix/theme-cleanup
