name: Consolidate Complete Theme

on:
  push:
    branches:
      - fix/theme-cleanup

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate complete historical theme
        run: python3 .github/scripts/consolidate_theme.py
      - name: Neutralize obsolete runtime asset loaders
        run: python3 .github/scripts/neutralize_theme_loaders.py
      - name: Commit consolidated theme
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No consolidation changes to commit.'
            exit 0
          fi
          git commit -m 'fix: finalize complete self-contained theme bundles'
          git push origin HEAD:fix/theme-cleanup
