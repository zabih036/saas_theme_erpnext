name: Form Layout Card Spacing
on:
  push:
    branches:
      - fix/form-layout-card-spacing
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply form spacing fix
        run: python3 .github/scripts/apply_form_layout_spacing.py
      - name: Validate JS
        run: node --check saas_theme/public/js/interaction_finish_v2.js
      - name: Validate architecture
        run: python3 scripts/validate_theme_architecture.py
      - name: Assert exact spacing contract
        run: |
          grep -F 'FORM CARD / COMMENTS SPACING V1' saas_theme/public/css/form_surface.css
          grep -F 'padding-inline: 10px !important' saas_theme/public/css/form_surface.css
          grep -F 'padding-top: 6px !important' saas_theme/public/css/form_surface.css
          grep -F 'AUTHORITATIVE FINAL FORM TABS V12' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'padding: 8px 18px 0 !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'border-radius: 14px 14px 0 0 !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F 'margin: 0 12px 8px !important' saas_theme/public/css/ui_consolidation_v7.css
          grep -F '/assets/saas_theme/css/form_surface.css?v=6' saas_theme/hooks.py
          grep -F '/assets/saas_theme/css/ui_consolidation_v7.css?v=12' saas_theme/hooks.py
          grep -F '/assets/saas_theme/js/interaction_finish_v2.js?v=7' saas_theme/hooks.py
      - name: Commit production fix
        run: |
          git config user.name 'Zabihullah'
          git config user.email '52412292+zabih036@users.noreply.github.com'
          git add saas_theme/hooks.py saas_theme/public/css/form_surface.css saas_theme/public/css/ui_consolidation_v7.css saas_theme/public/js/interaction_finish_v2.js scripts/validate_theme_architecture.py
          git commit -m 'fix: tighten form card spacing and preserve tab radius' || exit 0
          git push origin HEAD:fix/form-layout-card-spacing
